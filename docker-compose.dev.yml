services:
  postgres:
    image: postgres:16-alpine
    container_name: vector-postgres-dev
    environment:
      POSTGRES_DB: vector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - vector_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vector"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  vector_postgres_data:
